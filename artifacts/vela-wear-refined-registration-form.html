<h1 class="font-display-md text-display-md mb-2">Now let's make you a Member.</h1>
<p class="text-on-surface-variant font-body-md text-body-md">We've sent a code to your email.</p>

<form class="space-y-item-gap">
<!-- Code Verification -->
<div class="space-y-micro">
<div class="flex justify-between items-baseline">
</div>

</div>
<!-- Name Details -->

<!-- Password -->

<div class="relative"><input class="w-full h-14 px-4 pr-12 bg-transparent border border-ink rounded-none focus:ring-0 focus:border-ink outline-none transition-all" id="password" placeholder="Password*" type="password"/><button class="absolute right-3 top-1/2 -translate-y-1/2 text-ink" id="togglePassword" type="button"><span class="material-symbols-outlined">visibility</span></button></div>
<div class="flex flex-col gap-1 mt-2"><span class="flex items-center gap-2 text-[12px] font-medium text-on-surface-variant"><span class="material-symbols-outlined text-[14px]">close</span> Minimum of 8 characters</span><span class="flex items-center gap-2 text-[12px] font-medium text-on-surface-variant"><span class="material-symbols-outlined text-[14px]">close</span> Uppercase, lowercase letters and one number</span></div>
</div>

</label>

<script>
        // Simple password toggle logic
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const iconSpan = this.querySelector('span');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                iconSpan.textContent = 'visibility';
                iconSpan.setAttribute('data-icon', 'visibility');
            } else {
                passwordInput.type = 'password';
                iconSpan.textContent = 'visibility_off';
                iconSpan.setAttribute('data-icon', 'visibility_off');
            }
        });

        // Code input auto-advance
        const codeInputs = document.querySelectorAll('input[id^="code"]');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });
    </script>
