<body class="bg-canvas text-ink min-h-screen flex flex-col font-body-md text-body-md antialiased">
<!-- TopNavBar Suppressed: Transactional/Linear intent (Registration form) -->
<main class="flex-grow flex items-center justify-center px-grid-margin py-section">
<div class="w-full max-w-[460px] mx-auto bg-surface-card p-card-internal">
<div class="text-center mb-item-gap">
<span class="font-display-md text-display-md text-ink tracking-tight block mb-micro">Vela Wear</span>
<h1 class="font-display-md text-display-md mb-2">Now let's make you a Member.</h1>
<p class="text-on-surface-variant font-body-md text-body-md">We've sent a code to your email.</p>
</div>
<form class="space-y-item-gap">
<!-- Code Verification -->
<div class="space-y-micro">
<div class="flex justify-between items-baseline">
<label class="font-title-md text-title-md text-ink block" for="code">Code</label>
<span class="font-caption-uc text-caption-uc text-primary cursor-pointer hover:underline">Resend Code</span>
</div>
<div class="flex gap-2">
<input class="w-12 h-14 text-center text-title-md font-title-md bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="code1" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="code2" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="code3" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="code4" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="code5" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="code6" maxlength="1" placeholder="·" type="text"/>
</div>
</div>
<!-- Name Details -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-micro">
<label class="font-title-md text-title-md text-ink block" for="firstName">First Name</label>
<input class="w-full h-12 px-4 bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="firstName" placeholder="First Name" type="text"/>
</div>
<div class="space-y-micro">
<label class="font-title-md text-title-md text-ink block" for="lastName">Surname</label>
<input class="w-full h-12 px-4 bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="lastName" placeholder="Surname" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-micro">
<label class="font-title-md text-title-md text-ink block" for="password">Password</label>
<div class="relative">
<input class="w-full h-12 px-4 pr-12 bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all" id="password" placeholder="Password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-ink transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<div class="text-on-surface-variant font-caption-uc text-caption-uc flex gap-4 mt-2 opacity-70">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">close</span> Minimum of 8 characters</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">close</span> Uppercase, lowercase, and one number</span>
</div>
</div>
<!-- Shopping Preference -->
<div class="space-y-micro">
<label class="font-title-md text-title-md text-ink block">Shopping Preference</label>
<div class="grid grid-cols-2 gap-4">
<label class="relative flex cursor-pointer">
<input class="peer sr-only" name="preference" type="radio" value="mens"/>
<div class="w-full h-12 flex items-center justify-center bg-canvas border border-hairline rounded peer-checked:border-ink peer-checked:bg-surface-dark peer-checked:text-on-dark transition-all font-title-md text-title-md">
                                Men's
                            </div>
</label>
<label class="relative flex cursor-pointer">
<input class="peer sr-only" name="preference" type="radio" value="womens"/>
<div class="w-full h-12 flex items-center justify-center bg-canvas border border-hairline rounded peer-checked:border-ink peer-checked:bg-surface-dark peer-checked:text-on-dark transition-all font-title-md text-title-md">
                                Women's
                            </div>
</label>
</div>

<label class="font-title-md text-title-md text-ink block" for="dob">Date of Birth</label>
<input class="w-full h-12 px-4 bg-canvas border border-hairline rounded focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all text-ink" id="dob" type="date"/>
<p class="text-on-surface-variant font-body-md text-[13px] opacity-70">Get a Vela Member Reward every year on your Birthday.</p>
</div>
<!-- Agreements -->
<div class="space-y-4 mt-8 pt-6 border-t border-hairline">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center mt-1">
<input class="w-5 h-5 bg-canvas border-hairline rounded text-primary focus:ring-primary/15 transition-all" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-ink transition-colors">Sign up for emails to get updates from Vela on products, offers, and your Member benefits.</span>
</label>
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center mt-1">
<input class="w-5 h-5 bg-canvas border-hairline rounded text-primary focus:ring-primary/15 transition-all" required="" type="checkbox"/>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-ink transition-colors">I agree to Vela's <a class="underline hover:text-primary" href="#">Privacy Policy</a> and <a class="underline hover:text-primary" href="#">Terms of Use</a>.</span>
</label>
</div>
<!-- Submit Action -->
<div class="pt-6">
<button class="w-full h-12 bg-primary text-on-primary rounded font-button text-button hover:bg-primary-fixed-variant active:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
                        Create Account
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>

</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Already a Member? <a class="text-ink underline font-title-md" href="#">Sign In</a></p>
</div>

<!-- Footer Suppressed: Transactional intent -->
<script>
        // Simple password toggle logic
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const iconSpan = this.querySelector('span');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                iconSpan.textContent = 'visibility';
                iconSpan.setAttribute('data-icon', 'visibility');
            } else {
                passwordInput.type = 'password';
                iconSpan.textContent = 'visibility_off';
                iconSpan.setAttribute('data-icon', 'visibility_off');
            }
        });

        // Code input auto-advance
        const codeInputs = document.querySelectorAll('input[id^="code"]');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if (this.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });
    </script>
