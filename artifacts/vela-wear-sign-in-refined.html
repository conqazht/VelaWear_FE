<body class="bg-canvas text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- TopNavBar (Transactional/Suppressed for Focus, keeping only Brand) -->
<header class="w-full top-0 sticky bg-canvas z-50 border-b border-hairline py-4">
<div class="max-w-[1280px] mx-auto flex justify-center items-center px-grid-margin">
<!-- Brand Logo -->
<a class="font-display-md text-display-md text-ink tracking-tight hover:text-primary transition-colors duration-300" href="#">
                Vela Wear
            </a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-grid-margin py-section">
<!-- Centered Container -->
<div class="w-full max-w-md bg-surface-card p-card-internal rounded shadow-sm">
<!-- Header Section -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-ink mb-4">Sign In</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">Enter your email and password to access your account.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Order Number Input -->
<div>
<label class="sr-only" for="order_number">Order Number*</label>
<input class="w-full px-4 py-3 bg-canvas border border-hairline rounded text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all duration-300 font-body-md text-body-md" id="email" name="email" placeholder="Email Address*" required="" type="email"/>
</div>
<!-- Email Address Input -->
<div class="space-y-2">
<div class="relative">
<label class="sr-only" for="password">Password*</label>
<input class="w-full px-4 py-3 bg-canvas border border-hairline rounded text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all duration-300 font-body-md text-body-md" id="password" name="password" placeholder="Password*" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="text-right">
<a class="text-ink text-body-md hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 rounded font-button text-button hover:bg-surface-tint active:bg-primary-container transition-colors duration-300 flex items-center justify-center mt-8" type="submit">Sign In</button>
</form>
<!-- Footer Link -->
</div><div class="mt-12 text-center font-body-md text-body-md text-on-surface-variant">New to Vela Wear? <a class="text-primary hover:text-surface-tint underline decoration-primary/30 underline-offset-4 transition-colors duration-300 ml-1" href="#">Join the Vela Community</a></div>
</main>
<!-- Footer (Suppressed for transactional focus as per rules, but a minimal version could be here if needed. Leaving it out to prioritize the canvas as requested in instructions for transactional flows). -->
