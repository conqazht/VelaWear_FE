<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vela Wear - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#3c4b34",
                        "on-tertiary-container": "#fff8f2",

                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "ink": "#1c1a18",
                        "on-surface": "#1d1b19",
                        "on-surface-variant": "#55423d",
                        "secondary-fixed": "#d7e8c9",
                        "inverse-surface": "#32302e",
                        "hairline": "#e3dccf",
                        "outline-variant": "#dcc1b9",
                        "primary-container": "#b5573a",
                        "on-tertiary-fixed-variant": "#604100",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f6efec",
                        "surface-dim": "#dfd9d5",
                        "on-secondary-container": "#58674e",
                        "surface-container-low": "#f9f2ef",
                        "secondary-fixed-dim": "#bbccae",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#ede7e3",
                        "canvas": "#f7f4ef",
                        "surface-container-lowest": "#ffffff",
                        "background": "#fff8f4",
                        "error": "#ba1a1a",
                        "on-background": "#1d1b19",
                        "surface-container-highest": "#e7e1de",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#121f0c",
                        "tertiary": "#765412",
                        "surface-variant": "#e7e1de",
                        "inverse-primary": "#ffb59f",
                        "secondary-container": "#d4e5c6",
                        "surface-card": "#efe7dc",
                        "tertiary-container": "#916c29",
                        "primary": "#964025",
                        "on-primary-fixed": "#3a0a00",
                        "on-dark": "#f7f4ef",
                        "surface-container": "#f3ede9",
                        "tertiary-fixed-dim": "#edbf74",
                        "tertiary-fixed": "#ffdeac",
                        "primary-fixed-dim": "#ffb59f",
                        "primary-fixed": "#ffdbd1",
                        "surface-dark": "#1c1a18",
                        "outline": "#89726c",
                        "on-tertiary-fixed": "#281900",
                        "on-primary-container": "#fff8f6",
                        "on-primary-fixed-variant": "#7c2d13"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "item-gap": "24px",
                        "grid-margin": "16px",
                        "section": "88px",
                        "micro": "8px",
                        "card-internal": "32px"
                    },
                    "fontFamily": {
                        "display-xl-mobile": ["Cormorant Garamond"],
                        "display-md": ["Cormorant Garamond"],
                        "title-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display-xl": ["Cormorant Garamond"],
                        "display-lg": ["Cormorant Garamond"],
                        "button": ["Inter"],
                        "caption-uc": ["Inter"]
                    },
                    "fontSize": {
                        "display-xl-mobile": ["40px", { "lineHeight": "1.1", "letterSpacing": "-0.5px", "fontWeight": "400" }],
                        "display-md": ["32px", { "lineHeight": "1.18", "letterSpacing": "-0.4px", "fontWeight": "400" }],

                        "display-lg": ["40px", { "lineHeight": "1.12", "letterSpacing": "-0.8px", "fontWeight": "400" }],
                        "button": ["14px", { "lineHeight": "1.0", "letterSpacing": "0.5px", "fontWeight": "500" }],

</head>
<body class="bg-canvas text-ink font-body-md text-body-md min-h-screen flex flex-col items-center justify-center p-grid-margin antialiased">
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Logo / Wordmark -->
<div class="mb-12">
<h1 class="font-display-md text-display-md text-ink tracking-tight">Vela Wear</h1>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h2 class="font-display-md text-display-md text-ink mb-4">Enter your email to join us or sign in.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Crafted for the intentional wardrobe.
            </p>
</div>
<!-- Form Container -->
<div class="w-full bg-surface-card p-card-internal rounded shadow-sm">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="sr-only" for="email">Email address</label>
<input class="w-full bg-canvas border border-hairline rounded-[6px] px-4 py-3 font-body-md text-body-md text-ink placeholder:text-outline-variant focus:outline-none focus:ring-[3px] focus:ring-primary/15 focus:border-primary transition-all duration-300" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
<!-- Submit Button -->
<div>
<button class="w-full bg-primary text-on-primary font-button text-button rounded-[6px] py-4 px-6 hover:bg-primary-fixed-variant active:bg-primary-fixed-variant transition-colors duration-300 flex justify-center items-center gap-2" type="submit">
                        Submit
                    </button>
</div>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    By continuing, I agree to Vela Wear's <a class="text-ink underline hover:text-primary transition-colors" href="#">Privacy Policy</a> and <a class="text-ink underline hover:text-primary transition-colors" href="#">Terms of Use</a>.
                </p>
</div>
</div>
<!-- Join Link -->
<div class="mt-12 text-center">
<a class="font-title-md text-title-md text-ink border-b border-ink hover:text-primary hover:border-primary transition-colors pb-1" href="#">Join the Vela Community</a>
</div>
</main>
</body></html>
