name: Full-stack E2E

on:
  push:
    branches: [main]
  schedule:
    # 02:00 Asia/Ho_Chi_Minh (UTC+7).
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend branch, tag, or SHA
        required: true
        default: main
        type: string
      backend_ref:
        description: Backend branch, tag, or SHA
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    fullstack-e2e-${{ github.event_name }}-
    ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_ref || github.ref }}-
    ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref || 'main' }}
  cancel-in-progress: true

jobs:
  fullstack-e2e:
    name: "Playwright full-stack"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velawear_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d velawear_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: "true"
      # A race regression must fail this run instead of becoming a green flaky retry.
      PLAYWRIGHT_RETRIES: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8080

      SPRING_PROFILES_ACTIVE: test
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/velawear_e2e
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"

      JWT_ACCESS_TOKEN_SECRET_KEY: fullstack-access-secret-key-for-ci-must-be-at-least-64-characters-long
      JWT_REFRESH_TOKEN_SECRET_KEY: fullstack-refresh-secret-key-for-ci-must-be-at-least-64-characters-long
      JWT_ACCESS_TOKEN_EXPIRATION: "900"
      JWT_REFRESH_TOKEN_EXPIRATION: "259200"

      RESEND_API_KEY: test-resend-api-key
      SEPAY_ENABLED: "false"

    steps:
      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          path: frontend
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_ref || github.sha }}
          persist-credentials: false

      - name: Check out backend
        uses: actions/checkout@v7
        with:
          repository: coqanklazy/VelaWear_BE
          path: backend
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref || 'main' }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          persist-credentials: false

      - name: Record resolved revisions
        shell: bash
        run: |
          {
            echo "### Full-stack revisions"
            echo "- Frontend: $(git -C frontend rev-parse HEAD)"
            echo "- Backend: $(git -C backend rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start backend
        shell: bash
        run: |
          chmod +x backend/mvnw
          cd backend
          nohup ./mvnw --batch-mode --no-transfer-progress spring-boot:run \
            > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend.pid"

      - name: Wait for backend health
        shell: bash
        run: |
          for _ in {1..60}; do
            if curl --silent --fail http://localhost:8080/actuator/health \
              | grep --quiet '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 backend.log
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full-stack Playwright tests
        working-directory: frontend
        run: pnpm test:e2e:fullstack

      - name: Upload full-stack artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullstack-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
